<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneCam H.264</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#9A968E;font:15px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;object-fit:contain}
p{position:fixed;inset:auto 0 45%;text-align:center;margin:0;padding:0 16px}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="/player.js"></script>
<script>
var cv = document.getElementById('c');
initPlayer(cv, location.hostname, location.port || 8091, {
  onFail: function () {
    var p = document.createElement('p');
    p.textContent = 'Ce navigateur ne peut pas décoder le H.264 ici (contexte non sécurisé). ' +
      'Dans OBS, utilise une Source média sur http://' + location.host + '/h264, ou la page :8090/view.';
    document.body.appendChild(p);
  }
});
</script>
</body></html>
